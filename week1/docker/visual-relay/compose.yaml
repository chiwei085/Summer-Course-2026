name: visual-relay

x-runtime-defaults: &runtime-defaults
  hostname: ${VISUAL_RELAY_X11_HOSTNAME:-visual-relay}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  init: false

services:
  relay-simulator:
    <<: *runtime-defaults
    profiles: ["runtime"]
    build:
      context: .
      target: simulator-runtime
    image: visual-relay/simulator:reference
    environment:
      SCOUT_HOST: scout-station
      CATCHER_HOST: catcher-station
      SCOUT_CAMERA_PORT: "5000"
      CATCHER_CAMERA_PORT: "5002"
      CONTROL_PORT: "6300"
      READY_PORT: "9000"
    networks:
      camera-net: {}
      control-net: {}
    healthcheck:
      test: ["CMD", "/opt/visual-relay/bin/healthcheck-service.sh", "9000"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768M

  scout-station:
    <<: *runtime-defaults
    profiles: ["runtime"]
    build:
      context: .
      target: scout-runtime
    image: visual-relay/scout:reference
    depends_on:
      relay-simulator:
        condition: service_started
    environment:
      CATCHER_HOST: catcher-station
      CAMERA_PORT: "5000"
      TRACK_UPDATE_PORT: "6100"
      HANDOFF_PORT: "6200"
      READY_PORT: "9001"
    networks:
      camera-net: {}
      handoff-net: {}
      control-net: {}
    healthcheck:
      test: ["CMD", "/opt/visual-relay/bin/healthcheck-service.sh", "9001"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  catcher-station:
    <<: *runtime-defaults
    profiles: ["runtime"]
    build:
      context: .
      target: catcher-runtime
    image: visual-relay/catcher:reference
    depends_on:
      relay-simulator:
        condition: service_started
    environment:
      SIMULATOR_HOST: relay-simulator
      CAMERA_PORT: "5002"
      TRACK_UPDATE_PORT: "6100"
      HANDOFF_PORT: "6200"
      CONTROL_PORT: "6300"
      READY_PORT: "9002"
    networks:
      camera-net: {}
      handoff-net: {}
      control-net: {}
    healthcheck:
      test: ["CMD", "/opt/visual-relay/bin/healthcheck-service.sh", "9002"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  camera-net:
    internal: true
  handoff-net:
    internal: true
  control-net:
    internal: true
