name: visual-relay

# It runs: one image for all three services, everything on the same flat
# default network, nothing supervised, nothing constrained.
#
# TODO: make ./grader/grade.sh fully green. Among other things it will
# demand from this file:
#
#   - the isolated per-plane networks from README.md / docs/architecture.png,
#     each service attached only where it belongs
#   - a per-service build target instead of one shared image (see the
#     Dockerfile TODO)
#   - a real healthcheck per service: each one answers `ready=true` on its
#     READY_PORT, and scripts/healthcheck-service.sh performs exactly that
#     probe. Getting the script into the images and wired up here is your
#     job.
#   - locked-down runtime containers: immutable root filesystem (the apps
#     only ever write under /tmp), no privilege escalation, explicit CPU and
#     RAM caps, and a restart policy
#
# The hostnames, env vars, ports, and entrypoint paths below are correct as
# is. The compose.gui-*.yaml overlays and scripts/*.sh are finished and need
# no changes.

services:
  relay-simulator:
    profiles: ["runtime"]
    hostname: ${VISUAL_RELAY_X11_HOSTNAME:-visual-relay}
    build:
      context: .
    image: visual-relay/simulator:reference
    entrypoint: /opt/visual-relay/bin/relay-simulator
    environment:
      SCOUT_HOST: scout-station
      CATCHER_HOST: catcher-station
      SCOUT_CAMERA_PORT: "5000"
      CATCHER_CAMERA_PORT: "5002"
      CONTROL_PORT: "6300"
      READY_PORT: "9000"

  scout-station:
    profiles: ["runtime"]
    hostname: ${VISUAL_RELAY_X11_HOSTNAME:-visual-relay}
    build:
      context: .
    image: visual-relay/scout:reference
    entrypoint: /opt/visual-relay/bin/scout-station
    environment:
      CATCHER_HOST: catcher-station
      CAMERA_PORT: "5000"
      TRACK_UPDATE_PORT: "6100"
      HANDOFF_PORT: "6200"
      READY_PORT: "9001"

  catcher-station:
    profiles: ["runtime"]
    hostname: ${VISUAL_RELAY_X11_HOSTNAME:-visual-relay}
    build:
      context: .
    image: visual-relay/catcher:reference
    entrypoint: /opt/visual-relay/bin/catcher-station
    environment:
      SIMULATOR_HOST: relay-simulator
      CAMERA_PORT: "5002"
      TRACK_UPDATE_PORT: "6100"
      HANDOFF_PORT: "6200"
      CONTROL_PORT: "6300"
      READY_PORT: "9002"
