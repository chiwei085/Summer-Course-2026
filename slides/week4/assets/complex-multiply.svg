<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7186"/>
    </marker>
  </defs>
  <rect width="760" height="430" rx="18" fill="#FFFFFF"/>

  <!-- reference circles: |z|=1 and |z|=2 -->
  <circle cx="240" cy="240" r="80" fill="none" stroke="#D9DCEE" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="240" cy="240" r="160" fill="none" stroke="#D9DCEE" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- axes -->
  <line x1="30" y1="240" x2="450" y2="240" stroke="#9AA0B3" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="240" y1="420" x2="240" y2="20" stroke="#9AA0B3" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="410" y="234" font-family="Noto Sans, sans-serif" font-size="18" fill="#6B7186">Re</text>
  <text x="250" y="29" font-family="Noto Sans, sans-serif" font-size="18" fill="#6B7186">Im</text>

  <!-- angle arcs -->
  <path d="M 288 240 A 48 48 0 0 0 274 202" fill="none" stroke="#0F7E88" stroke-width="3"/>
  <text x="292" y="214" font-family="Noto Sans, sans-serif" font-size="17" fill="#0F7E88">45°</text>
  <path d="M 328 240 A 88 88 0 0 0 240 152" fill="none" stroke="#C2495D" stroke-width="3"/>
  <text x="272" y="144" font-family="Noto Sans, sans-serif" font-size="17" fill="#C2495D">90°</text>

  <!-- z = 1+i -->
  <line x1="240" y1="240" x2="320" y2="160" stroke="#0F7E88" stroke-width="9" stroke-linecap="round"/>
  <circle cx="320" cy="160" r="9" fill="#0F7E88"/>
  <circle cx="240" cy="240" r="8" fill="#1A1D26"/>
  <text x="332" y="156" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#0F7E88">z = 1+i</text>
  <text x="332" y="180" font-family="Noto Sans, sans-serif" font-size="17" fill="#3D4357">|z| = √2, arg z = 45°</text>

  <!-- z^2 = 2i -->
  <line x1="240" y1="240" x2="240" y2="80" stroke="#C2495D" stroke-width="9" stroke-linecap="round"/>
  <circle cx="240" cy="80" r="9" fill="#C2495D"/>
  <text x="120" y="72" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#C2495D">z² = 2i</text>
  <text x="228" y="96" text-anchor="end" font-family="Noto Sans, sans-serif" font-size="17" fill="#3D4357">|z²| = 2, arg z² = 90°</text>

  <!-- summary card -->
  <rect x="500" y="130" width="230" height="180" rx="12" fill="#F4F5FB" stroke="#D9DCEE"/>
  <text x="520" y="162" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#343D93">乘法 = 縮放 + 旋轉</text>
  <text x="520" y="194" font-family="Noto Sans, sans-serif" font-size="17" fill="#3D4357">|z·z| = |z||z| = 2</text>
  <text x="520" y="220" font-family="Noto Sans, sans-serif" font-size="17" fill="#3D4357">arg(z·z) = 45°+45° = 90°</text>
  <text x="520" y="258" font-family="Noto Sans, sans-serif" font-size="17" fill="#6B7186">(1+i)(1+i)</text>
  <text x="520" y="282" font-family="Noto Sans, sans-serif" font-size="17" fill="#6B7186">= 1+2i+i² = 2i</text>
</svg>
