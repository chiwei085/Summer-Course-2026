<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7186"/>
    </marker>
  </defs>
  <rect width="760" height="430" rx="18" fill="#FFFFFF"/>
  <circle cx="240" cy="220" r="180" fill="#4A57C8" fill-opacity="0.07" stroke="#4A57C8" stroke-width="3"/>
  <line x1="42" y1="220" x2="445" y2="220" stroke="#9AA0B3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="410" x2="240" y2="20" stroke="#9AA0B3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="448" y="214" font-family="Noto Sans, sans-serif" font-size="18" fill="#6B7186">x</text>
  <text x="250" y="29" font-family="Noto Sans, sans-serif" font-size="18" fill="#6B7186">y</text>
  <text x="405" y="249" font-family="Noto Sans, sans-serif" font-size="18" fill="#4A57C8">r = 2</text>

  <polyline points="240,220 330,220 330,130" fill="none" stroke="#0F7E88" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="240,220 240,130 330,130" fill="none" stroke="#C2495D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 9"/>
  <circle cx="240" cy="220" r="9" fill="#1A1D26"/>
  <circle cx="330" cy="220" r="9" fill="#0F7E88"/>
  <circle cx="240" cy="130" r="9" fill="#C2495D"/>
  <circle cx="330" cy="130" r="11" fill="#B45309" stroke="#FFFFFF" stroke-width="4"/>
  <text x="340" y="124" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#B45309">target (1,1)</text>

  <line x1="492" y1="110" x2="545" y2="110" stroke="#0F7E88" stroke-width="9" stroke-linecap="round"/>
  <text x="555" y="117" font-family="Noto Sans, sans-serif" font-size="18" fill="#1A1D26">elbow-down: (0, π/2)</text>
  <line x1="492" y1="168" x2="545" y2="168" stroke="#C2495D" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 9"/>
  <text x="555" y="175" font-family="Noto Sans, sans-serif" font-size="18" fill="#1A1D26">elbow-up: (π/2, −π/2)</text>

  <rect x="485" y="232" width="230" height="106" rx="12" fill="#F4F5FB" stroke="#D9DCEE"/>
  <text x="505" y="264" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#343D93">l₁ = l₂ = 1</text>
  <text x="505" y="296" font-family="Noto Sans, sans-serif" font-size="18" fill="#3D4357">reachable ⇔ 0 ≤ r ≤ 2</text>
  <text x="505" y="326" font-family="Noto Sans, sans-serif" font-size="18" fill="#3D4357">boundary r = 2 ⇒ singular</text>
</svg>
