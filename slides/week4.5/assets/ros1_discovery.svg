<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7186"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F7E88"/>
    </marker>
  </defs>
  <rect width="780" height="380" rx="18" fill="#FFFFFF"/>

  <!-- Master -->
  <rect x="310" y="30" width="160" height="70" rx="12" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="390" y="58" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#343D93">roscore</text>
  <text x="390" y="80" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" fill="#4A57C8">XML-RPC Master</text>

  <!-- Publisher node -->
  <rect x="60" y="250" width="190" height="80" rx="12" fill="#F4F5FB" stroke="#9AA0B3" stroke-width="1.5"/>
  <text x="155" y="282" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="700" fill="#1A1D26">Publisher node</text>
  <text x="155" y="305" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" fill="#6B7186">advertise("/scan")</text>

  <!-- Subscriber node -->
  <rect x="530" y="250" width="190" height="80" rx="12" fill="#F4F5FB" stroke="#9AA0B3" stroke-width="1.5"/>
  <text x="625" y="282" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="700" fill="#1A1D26">Subscriber node</text>
  <text x="625" y="305" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" fill="#6B7186">subscribe("/scan")</text>

  <!-- step 1: publisher registers -->
  <path d="M 200 250 C 230 190, 300 120, 330 100" fill="none" stroke="#6B7186" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a1)"/>
  <text x="200" y="180" font-family="Noto Sans, sans-serif" font-size="13" fill="#6B7186">① 登記位址(XML-RPC)</text>

  <!-- step 2: subscriber asks and gets list -->
  <path d="M 590 250 C 560 190, 490 120, 455 100" fill="none" stroke="#6B7186" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a1)"/>
  <text x="470" y="175" font-family="Noto Sans, sans-serif" font-size="13" fill="#6B7186">② 查詢「誰在發布」</text>
  <path d="M 440 105 C 480 140, 560 200, 605 245" fill="none" stroke="#6B7186" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a1)"/>
  <text x="530" y="210" font-family="Noto Sans, sans-serif" font-size="13" fill="#6B7186">③ 回傳 publisher 清單</text>

  <!-- step 3: direct TCP data path -->
  <line x1="250" y1="290" x2="530" y2="290" stroke="#0F7E88" stroke-width="3.5" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <text x="390" y="345" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#0F7E88">④ 直接 TCPROS 連線（Master 不在資料路徑上）</text>
</svg>
