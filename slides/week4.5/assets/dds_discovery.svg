<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A57C8"/>
    </marker>
  </defs>
  <rect width="780" height="420" rx="18" fill="#FFFFFF"/>

  <!-- three participants, no master -->
  <circle cx="390" cy="145" r="58" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="390" y="139" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#343D93">Participant A</text>
  <text x="390" y="159" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#4A57C8">writer /scan</text>

  <circle cx="150" cy="300" r="58" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="150" y="294" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#343D93">Participant B</text>
  <text x="150" y="314" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#4A57C8">reader /scan</text>

  <circle cx="630" cy="300" r="58" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="630" y="294" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#343D93">Participant C</text>
  <text x="630" y="314" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#4A57C8">reader /scan</text>

  <!-- multicast broadcast rings from A -->
  <circle cx="390" cy="145" r="80" fill="none" stroke="#9AA0B3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="390" cy="145" r="105" fill="none" stroke="#C7CBDA" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- PDP mutual discovery arrows (every pair, no arbiter) -->
  <line x1="340" y1="185" x2="195" y2="262" stroke="#9AA0B3" stroke-width="2" marker-end="url(#b1)" marker-start="url(#b1)"/>
  <line x1="440" y1="185" x2="585" y2="262" stroke="#9AA0B3" stroke-width="2" marker-end="url(#b1)" marker-start="url(#b1)"/>
  <line x1="208" y1="300" x2="572" y2="300" stroke="#9AA0B3" stroke-width="2" marker-end="url(#b1)" marker-start="url(#b1)"/>

  <text x="390" y="26" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" fill="#6B7186">週期性 multicast 廣播自我描述（PDP），沒有中央仲裁者</text>

  <!-- QoS match badges -->
  <rect x="30" y="365" width="330" height="44" rx="10" fill="#E9F6EF" stroke="#2F855A" stroke-width="1.5"/>
  <text x="45" y="392" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700" fill="#2F855A">✓ A(RELIABLE) ↔ B(RELIABLE) 相容</text>

  <rect x="420" y="365" width="330" height="44" rx="10" fill="#FBEBEC" stroke="#C2495D" stroke-width="1.5"/>
  <text x="435" y="392" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700" fill="#C2495D">✕ A(RELIABLE) ↔ C(BEST_EFFORT) 不相容</text>
</svg>
