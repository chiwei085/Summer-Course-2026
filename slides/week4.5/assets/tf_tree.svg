<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A57C8"/>
    </marker>
    <marker id="f2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F7E88"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="18" fill="#FFFFFF"/>

  <!-- map -->
  <rect x="330" y="20" width="120" height="46" rx="10" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="390" y="49" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#343D93">map</text>

  <!-- odom -->
  <rect x="330" y="100" width="120" height="46" rx="10" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="390" y="129" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#343D93">odom</text>
  <line x1="390" y1="66" x2="390" y2="98" stroke="#4A57C8" stroke-width="2.5" marker-end="url(#f1)"/>
  <text x="470" y="88" font-family="Noto Sans, sans-serif" font-size="12" fill="#4A57C8">dynamic ~10 Hz（定位修正）</text>

  <!-- base_link -->
  <rect x="330" y="180" width="120" height="46" rx="10" fill="#EEF0FA" stroke="#4A57C8" stroke-width="2"/>
  <text x="390" y="209" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#343D93">base_link</text>
  <line x1="390" y1="146" x2="390" y2="178" stroke="#4A57C8" stroke-width="2.5" marker-end="url(#f1)"/>
  <text x="470" y="168" font-family="Noto Sans, sans-serif" font-size="12" fill="#4A57C8">dynamic ~50 Hz（輪式里程計）</text>

  <!-- static children of base_link -->
  <rect x="60" y="280" width="120" height="42" rx="10" fill="#E6F3F4" stroke="#0F7E88" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="120" y="306" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#0F7E88">laser_link</text>

  <rect x="210" y="280" width="120" height="42" rx="10" fill="#E6F3F4" stroke="#0F7E88" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="270" y="306" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#0F7E88">imu_link</text>

  <rect x="360" y="280" width="120" height="42" rx="10" fill="#E6F3F4" stroke="#0F7E88" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="420" y="306" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#0F7E88">mast_link</text>

  <line x1="360" y1="226" x2="130" y2="278" stroke="#0F7E88" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#f2)"/>
  <line x1="380" y1="226" x2="275" y2="278" stroke="#0F7E88" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#f2)"/>
  <line x1="410" y1="226" x2="420" y2="278" stroke="#0F7E88" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#f2)"/>

  <!-- camera_link under mast -->
  <rect x="360" y="345" width="130" height="42" rx="10" fill="#E6F3F4" stroke="#0F7E88" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="425" y="371" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#0F7E88">camera_link</text>
  <line x1="420" y1="322" x2="425" y2="343" stroke="#0F7E88" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#f2)"/>

  <!-- camera_optical_frame to the right -->
  <rect x="560" y="345" width="200" height="42" rx="10" fill="#E6F3F4" stroke="#0F7E88" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="660" y="371" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#0F7E88">camera_optical_frame</text>
  <line x1="490" y1="366" x2="558" y2="366" stroke="#C2495D" stroke-width="2.5" marker-end="url(#f2)"/>
  <text x="524" y="356" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#C2495D">REP-103 旋轉</text>

  <text x="20" y="410" font-family="Noto Sans, sans-serif" font-size="12" fill="#6B7186">實線 = dynamic edge（隨時間變化，走 /tf）　虛線 = static edge（發布一次，走 /tf_static，TRANSIENT_LOCAL）</text>
</svg>
