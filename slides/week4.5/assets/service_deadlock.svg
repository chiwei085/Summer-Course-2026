<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340">
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2495D"/>
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7186"/>
    </marker>
  </defs>
  <rect width="780" height="340" rx="18" fill="#FFFFFF"/>

  <text x="30" y="34" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#1A1D26">單執行緒 executor 裡的同步 service 呼叫</text>

  <!-- executor thread box -->
  <rect x="60" y="70" width="280" height="110" rx="12" fill="#F4F5FB" stroke="#9AA0B3" stroke-width="1.5"/>
  <text x="200" y="100" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700" fill="#1A1D26">callback 執行緒（唯一一條）</text>
  <rect x="90" y="115" width="220" height="45" rx="8" fill="#FBEBEC" stroke="#C2495D" stroke-width="2"/>
  <text x="200" y="143" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#C2495D">卡在 call()，等 response</text>

  <!-- service response topic -->
  <rect x="440" y="70" width="280" height="110" rx="12" fill="#F4F5FB" stroke="#9AA0B3" stroke-width="1.5"/>
  <text x="580" y="100" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700" fill="#1A1D26">response 已經送達</text>
  <rect x="470" y="115" width="220" height="45" rx="8" fill="#FBF3E7" stroke="#B45309" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="580" y="143" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" font-weight="700" fill="#B45309">要靠同一條執行緒才能被取走</text>

  <!-- circular dependency arrow -->
  <path d="M 340 125 L 440 125" fill="none" stroke="#6B7186" stroke-width="2.5" marker-end="url(#d2)"/>
  <text x="390" y="115" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#6B7186">送達</text>

  <path d="M 580 180 C 580 230, 200 230, 200 180" fill="none" stroke="#C2495D" stroke-width="2.5" marker-end="url(#d1)"/>
  <text x="390" y="248" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" fill="#C2495D">但要處理它，得先讓 executor 迴圈繼續跑，而執行緒正被 call() 佔用</text>

  <rect x="120" y="272" width="540" height="46" rx="10" fill="#EEF0FA" stroke="#4A57C8" stroke-width="1.5"/>
  <text x="390" y="301" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700" fill="#343D93">死結：兩邊都在等對方先讓步</text>
</svg>
