# Default hyperparameters for `src.train`, modeled after
# `basic_regression_classification`'s config.yaml: every CLI flag has a
# matching key here, and any value not passed on the command line falls
# back to what's written in this file.
#
# Resolution order (highest wins): CLI flag > `--config <path>` > this file.

model: bigram          # bigram | transformer
bins_per_dim: 16       # action tokenizer: bins per axis (vocab_size = bins_per_dim^2)
block_size: 16         # context window length in action steps (episodes range 49-246 steps)
n_embd: 64             # embedding dim (transformer only)
n_head: 4              # attention heads (transformer only)
n_layer: 2             # transformer blocks (transformer only)
dropout: 0.0           # transformer only
epochs: 5
steps_per_epoch: 200   # gradient steps per epoch (episodes have no fixed corpus size)
lr: 0.01               # AdamW learning rate
batch_size: 64
seed: 0
val_episode: 0         # which held-out episode to roll out for the per-epoch sample
prompt_len: 8          # real action steps fed as context before rolling out
gen_length: 50         # action steps to roll out for the sample
temperature: 0.8       # sampling temperature for the rollout
run_id: null           # auto-generated if omitted
device: null           # cuda | cpu; auto-detected if omitted
