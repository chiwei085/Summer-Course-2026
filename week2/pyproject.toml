[project]
name = "week2"
version = "0.1.0"
description = "Deep Learning Course Notebook"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B018", # Keep final expressions useful in teaching notebooks.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "datasets[vision]>=4.4.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.8",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.1",
    "transformers>=5.12.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
