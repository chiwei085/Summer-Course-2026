# Patchify the 96x96 frame into an 8x8 grid of 12x12 patches and run them
# through the same self-attention block basic_sequence_bc uses for action
# tokens -- minus the causal mask, since patches have no time order.
model: vit
patch_size: 12
n_embd: 128
n_head: 4
n_layer: 4
dropout: 0.1
epochs: 8
steps_per_epoch: 200
lr: 0.0005
batch_size: 64
